<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO LAB</title><style>
:root{--bg:#0a1316;--bd:#ffffff22;--ac:#4ff0b0;--mut:#89a0a6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#12303a,var(--bg) 60%) fixed;color:#e6f1ee;font:15px/1.5 'Noto Sans KR',system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:210px;padding:16px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{margin:0;letter-spacing:3px;color:var(--ac);font-size:22px}nav small{color:var(--mut);display:block;margin-bottom:10px}
nav button{display:block;width:100%;text-align:left;margin:3px 0;padding:9px 10px;background:none;border:1px solid transparent;border-radius:8px;color:#cde;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:#4ff0b01a;border-color:#4ff0b055}
main{flex:1;padding:16px;min-width:0}h2,h3{margin:0 0 8px}
.card{background:#ffffff0d;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
svg{width:100%;height:auto;max-height:68vh;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid #4ff0b066;background:#4ff0b014;color:#e6f1ee;font:inherit;cursor:pointer}
.b:hover{background:#4ff0b033}.b.sel{background:#4ff0b04d;border-color:var(--ac)}.b.ok{background:#1f9d60;border-color:#6fdc9f}.b.no{background:#a83a3a;border-color:#f08}
input[type=range]{width:150px;accent-color:var(--ac)}label{display:flex;flex-direction:column;font-size:13px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.big{font-size:34px;color:var(--ac);font-weight:700}
.bar{height:10px;background:#ffffff18;border-radius:6px;overflow:hidden;min-width:120px;flex:1}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.gau{flex:1;min-width:160px;font-size:13px}svg text{pointer-events:none;user-select:none;paint-order:stroke;stroke:#0a1316;stroke-width:3px;stroke-linejoin:round}td{padding:3px 8px;vertical-align:top}.cl{cursor:pointer}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow:auto;gap:4px;padding:8px}nav h1,nav small{display:none}nav button{white-space:nowrap;width:auto}}
</style></head><body><nav id=nav></nav><main></main><script>
const $=s=>document.querySelector(s),E=id=>document.getElementById(id),v=id=>+E(id).value,NS='http://www.w3.org/2000/svg';
const U=['광합성','식물의 물질 이동','식물의 호흡','영양소','소화','호흡','순환','배설'];
const CC={o:'#ff5c5c',c:'#aab8c2',w:'#4aa8ff',g:'#ffd23f'};
const f=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
let S=JSON.parse(localStorage.getItem('biolab')||'null')||{tot:0,cor:0,days:[],td:{d:'',n:0},rec:'',wrong:[],tp:{}};
const save=()=>localStorage.setItem('biolab',JSON.stringify(S));
const streak=()=>{let n=0,d=new Date();for(let k=0;k<400;k++){if(S.days.includes(f(d)))n++;else if(k>0)break;d.setDate(d.getDate()-1)}return n};
/* ---------- 입자 엔진 ---------- */
let PL=[],TM=[],last=0;
const at=(p,t)=>{const n=p.length-1,x=Math.min(t,.9999)*n,i=x|0,u=x-i;return[p[i][0]+(p[i+1][0]-p[i][0])*u,p[i][1]+(p[i+1][1]-p[i][1])*u]};
function fly(p,c,o={}){const g=E(o.g||'pl');if(!g)return;const e=document.createElementNS(NS,'circle');e.setAttribute('r',o.r||4);e.setAttribute('fill',c);e.setAttribute('opacity',0);g.appendChild(e);PL.push({e,p,t:-(o.d||0)/(o.T||2500),T:o.T||2500,end:o.end,c2:o.c2})}
function tick(ts){const dt=Math.min(50,ts-last);last=ts;const old=PL;PL=[];old.forEach(q=>{q.t+=dt/q.T;if(q.t<0){PL.push(q);return}if(q.t>=1){q.e.remove();q.end&&q.end();return}const[x,y]=at(q.p,q.t);q.e.setAttribute('cx',x);q.e.setAttribute('cy',y);q.e.setAttribute('opacity',1);if(q.c2&&q.t>.5)q.e.setAttribute('fill',q.c2);PL.push(q)});requestAnimationFrame(tick)}
requestAnimationFrame(tick);
const every=(ms,fn)=>TM.push(setInterval(fn,ms)),later=(ms,fn)=>TM.push(setTimeout(fn,ms));
function an(a,b,ms,fn,d){const s=performance.now();(function st(t){const u=Math.max(0,Math.min(1,(t-s)/ms));try{fn(a+(b-a)*u)}catch(e){return}u<1?requestAnimationFrame(st):d&&d()})(s)}
/* ---------- 공통 UI ---------- */
function page(n,inner,ctl,vb='0 0 600 340'){$('main').innerHTML=`<div class=card><h2>UNIT 0${DN[n]} · ${U[n-1]}</h2><svg id=sv viewBox="${vb}">${inner}<g id=pl></g></svg></div><div class="card row">${ctl}</div><div class=card id=info></div>`}
const info=t=>E('info').innerHTML=t;
const T=(x,y,t,c='#cfe',s=13)=>`<text x=${x} y=${y} fill="${c}" font-size=${s} text-anchor=middle>${t}</text>`;
const btn=(l,fn,x='')=>`<button class=b onclick="${fn}" ${x}>${l}</button>`;
const sl=(id,l,val,max=100)=>`<label>${l}<input type=range id=${id} min=0 max=${max} value=${val}></label>`;
const leg=`<span style=color:${CC.o}>● 산소</span> <span style=color:${CC.c}>● 이산화 탄소</span> <span style=color:${CC.w}>● 물</span> <span style=color:${CC.g}>● 포도당</span>`;
const zoom=()=>{const s=E('sv');s.setAttribute('viewBox',s.getAttribute('viewBox')=='0 0 600 340'?'170 90 260 160':'0 0 600 340')};
const V={},DN={1:1,3:2,4:3,5:4,6:5,7:6,8:7};
const TL=(x,y,t,c='#cfe',s=12)=>`<text x=${x} y=${y} fill="${c}" font-size=${s}>${t}</text>`;
const LG=(a,x,y,dx,dy,n)=>TL(x,y-18,'입자 범례','#fff',12)+a.map((q,i)=>`<circle cx=${x+(i%n)*dx+6} cy=${y+((i/n)|0)*dy-4} r=${q[1]} fill="${q[0]}" />`+TL(x+(i%n)*dx+18,y+((i/n)|0)*dy,q[2])).join('');
/* ---------- UNIT 01 광합성 ---------- */
V[1]=()=>{const FX=[['l','빛의 세기'],['c','이산화 탄소 공급'],['w','물 공급'],['t','온도(℃)']];
page(1,`<rect x=255 y=285 width=90 height=50 rx=8 fill=#8a5a3a />${T(300,318,'화분','#fff',11)}<rect x=295 y=255 width=10 height=35 fill=#3a8f4a /><path d="M290 315C260 320 250 325 240 335M310 315C340 320 350 325 360 335" stroke=#b98 stroke-width=3 fill=none />
<ellipse cx=300 cy=160 rx=210 ry=105 fill=#1c6a3c stroke=#3fbf78 stroke-width=2 /><path d="M90 160H510M200 160L260 90M300 160L360 235M380 160L430 100" stroke=#3fbf78 stroke-width=3 fill=none />
<ellipse id=chl cx=300 cy=160 rx=62 ry=36 fill=#37d67a stroke=#c8ffd8 />${[-30,0,30].map(x=>`<ellipse cx=${300+x} cy=160 rx=8 ry=14 fill=#1a9d55 />`).join('')}${T(300,212,'엽록체','#fff')}${T(70,72,'이산화 탄소 ↓',CC.c)}${T(300,272,'물 ↑',CC.w)}${T(535,32,'산소 ↗',CC.o)}${T(405,245,'포도당',CC.g)}`,
FX.map(a=>btn(a[1]+' 실험',`fxs('${a[0]}')`,`id=f${a[0]}`)).join('')+'<label id=slw style="min-width:210px"></label>');
info(`<b>이산화 탄소 + 물 → 포도당 + 산소</b><br>선택한 요인만 바꾸고 나머지는 고정합니다 → <span id=fxd></span><br>광합성 속도 <b id=rt>0%</b> · ${leg}`);
window.fxs=k=>{window.fx=k;FX.forEach(a=>E('f'+a[0]).classList.toggle('sel',a[0]==k));E('slw').innerHTML=FX.find(a=>a[0]==k)[1]+`: <b id=xv></b><input type=range id=x min=0 max=${k=='t'?50:100} value=${k=='t'?5:15}>`;E('fxd').textContent=FX.filter(a=>a[0]!=k).map(a=>a[1]+' '+(a[0]=='t'?'25℃':'충분')).join(' · ')};fxs('l');
every(450,()=>{const x=v('x'),k=fx=='t'?Math.max(0,1-Math.abs(x-25)/25):x/100;E('xv').textContent=x+(fx=='t'?'℃':'%');E('chl').style.filter=`drop-shadow(0 0 ${k*24}px #9fffb0)`;E('rt').textContent=Math.round(k*100)+'%';if(k<.05)return;for(let i=0;i<Math.ceil(k*3);i++){fly([[40,90],[200,130],[260,155]],CC.c,{d:i*120,end:()=>{fly([[335,150],[450,80],[570,45]],CC.o,{T:2000});fly([[335,175],[405,230]],CC.g,{T:1500})}});fly([[300,270],[300,200]],CC.w,{d:i*150,T:2000})}})};
/* ---------- UNIT 03 식물의 호흡 ---------- */
V[3]=()=>{const N=['새벽','낮','저녁','밤'];window.ph=0.5;
page(3,`<rect id=sky width=600 height=340 rx=12 fill=#3a3a66 style="transition:fill 1s" /><ellipse cx=300 cy=160 rx=190 ry=85 fill=#1c6a3c /><rect x=294 y=240 width=12 height=90 fill=#3a8f4a /><path d="M300 330L250 340M300 330L350 340" stroke=#b98 stroke-width=3 />${T(60,60,'CO₂ ↓ (광합성)',CC.c,11)}${T(60,250,'O₂ ↓ (호흡)',CC.o,11)}${T(545,30,'O₂ ↗',CC.o,11)}${T(545,255,'CO₂ ↗',CC.c,11)}`,
N.map((n,i)=>btn(n,`tm(${i})`,`id=t${i}`)).join(''));
info(`광합성: 이산화 탄소 + 물 → 포도당 + 산소<br>호흡: <b>포도당 + 산소 → 이산화 탄소 + 물 + 에너지</b><div id=nt></div>`);
const D=[[.5,'#5a4a7a'],[3,'#5ab8ff'],[1,'#d9762f'],[0,'#0e1230']];
window.tm=i=>{window.ph=D[i][0];E('sky').setAttribute('fill',D[i][1]);N.forEach((_,j)=>E('t'+j).classList.toggle('sel',i==j));const n=ph-1,s=x=>(x>0?'+':'')+x;E('nt').innerHTML=`광합성 <b>${ph}</b> · 호흡 <b>1</b><br>산소의 순변화 <b>${s(n)}</b> (${n>0?'방출':n<0?'흡수':'0'}) · 이산화 탄소의 순변화 <b>${s(-n)}</b>`};tm(1);
every(700,()=>{const n=Math.floor(ph)+(Math.random()<ph%1?1:0);for(let i=0;i<n;i++){fly([[60,70],[220,140],[260,155]],CC.c,{d:i*150,T:2000});fly([[330,150],[450,90],[560,40]],CC.o,{d:i*150,T:2200})}fly([[60,240],[240,190]],CC.o,{T:2200});fly([[340,190],[560,250]],CC.c,{T:2200})})};
/* ---------- UNIT 04 영양소 ---------- */
V[4]=()=>{const SM=[['밥','#f1ecd6','s'],['우유','#f7f7ee','pf'],['달걀흰자','#f0e7c4','p'],['식용유','#eec84a','f'],['포도당 용액','#d9eef7','r'],['미지의 시료','#e6e6e6','spfr'[Math.random()*4|0]]],
RG=[['아이오딘-아이오딘화 칼륨 용액','#c27a2c','#1a2472','#c48a3c','s'],['베네딕트 용액','#3d78d6','#d2501e','#3d78d6','r'],['뷰렛 용액','#79b4f7','#8b3fc9','#5fa2ee','p'],['수단Ⅲ 용액','#e8b7a8','#d2402c','#e8d3cc','f']],X={s:-1,r:-1,ph:0};
page(4,`<defs><clipPath id=tc><path d="M270 100V250a30 30 0 0060 0V100z"/></clipPath></defs><rect id=liq x=270 y=170 width=60 height=140 clip-path="url(#tc)" fill=#0000 style="transition:fill 2s" /><path d="M270 100V250a30 30 0 0060 0V100" stroke=#dfe fill=none stroke-width=3 /><g id=fl style=display:none><path d="M290 340Q300 300 310 340Z" fill=#ff8a2a /></g>${T(300,25,'시약 ▼','#89a',12)}`,
`<div><b>시료</b><br>${SM.map((s,i)=>btn(s[0],`pS(${i})`,`id=s${i}`)).join('')}</div><div><b>시약</b><br>${RG.map((s,i)=>btn(s[0],`pR(${i})`,`id=r${i}`)).join('')}</div><div>${btn('시약 넣기','dr()')}${btn('가열(베네딕트)','ht()')}<br>${btn('양성(있다)','jd(1)')}${btn('음성(없다)','jd(0)')}</div>`,'0 0 600 350');
const say=t=>info(t);say('시료와 시약을 고르고 [시약 넣기]를 누른 뒤, 색 변화를 관찰해서 직접 판정하세요.');
const sel=(p,n,i)=>{for(let j=0;j<n;j++)E(p+j).classList.toggle('sel',i==j)};
window.pS=i=>{X.s=i;X.ph=0;sel('s',6,i);E('liq').style.fill=SM[i][1]};window.pR=i=>{X.r=i;sel('r',4,i)};
const chg=()=>{const k=RG[X.r][4],pos=SM[X.s][2].includes(k);E('liq').style.fill=pos?RG[X.r][2]:RG[X.r][3];X.ph=2;E('fl').style.display='none';say('색을 관찰하고 판정하세요.')};
window.dr=()=>{if(X.s<0||X.r<0)return say('시료와 시약을 먼저 고르세요.');if(X.ph)return say('새 시료를 고른 뒤 다시 실험하세요.');X.ph=1;const R=RG[X.r];for(let i=0;i<3;i++)fly([[300,30],[300,160]],R[1],{r:5,d:i*600,T:700,end:()=>{E('liq').style.fill=R[1];if(i==2){R[4]=='r'?say('베네딕트 용액은 <b>가열</b>해야 반응합니다.'):later(600,chg)}}})};
window.ht=()=>{if(X.ph!=1||RG[X.r][4]!='r')return say('베네딕트 용액을 넣은 뒤 가열할 수 있습니다.');E('fl').style.display='';for(let i=0;i<6;i++)fly([[300,270],[300,180]],'#fff8',{r:3,d:i*300,T:900});later(2200,chg)};
window.jd=b=>{if(X.ph!=2)return say('먼저 실험을 끝까지 관찰하세요.');const R=RG[X.r],pos=SM[X.s][2].includes(R[4]),N={s:'녹말',r:'포도당(당)',p:'단백질',f:'지방'};say(`${b==pos?'✅ 정답':'❌ 오답'} — ${SM[X.s][0]}에는 ${N[R[4]]}이(가) ${pos?'있습니다':'없습니다'}. (${R[0]}: ${pos?'색 변화 나타남':'색 변화 없음'})`)}};
/* ---------- UNIT 05 소화 ---------- */
V[5]=()=>{const O={mouth:['입','침샘에서 침이 분비됩니다. 침의 <b>아밀레이스</b>가 녹말 분해를 시작합니다.'],eso:['식도','음식물을 위로 운반합니다. 소화액은 없습니다.'],sto:['위','위액의 <b>펩신</b>(+염산)이 단백질을 분해합니다.'],liv:['간','쓸개즙을 만듭니다. (소화 효소 없음)'],gal:['쓸개','쓸개즙을 저장했다가 작은창자로 내보냅니다. 쓸개즙은 효소가 아니라 <b>지방의 소화를 돕습니다</b>.'],pan:['이자','이자액(<b>트립신·아밀레이스·라이페이스</b>)을 작은창자로 분비합니다.'],sm:['작은창자','이자액·쓸개즙·장액이 작용해 녹말→포도당, 단백질→아미노산, 지방→지방산으로 완전히 소화되고 혈액으로 흡수됩니다.'],lg:['큰창자','남은 물을 흡수합니다.']},
J=[['침','침샘에서 만들어져 입으로 분비. 효소: <b>아밀레이스</b> → 녹말 분해'],['위액','위에서 만들어져 위로 분비. 효소: <b>펩신</b> → 단백질 분해'],['이자액','이자에서 만들어져 작은창자로 분비. 효소: <b>트립신</b>(단백질), <b>아밀레이스</b>(녹말), <b>라이페이스</b>(지방)'],['쓸개즙','간에서 만들고 쓸개에 저장 → 작은창자로 분비. <b>효소 없음</b>, 지방을 잘게 나누어 라이페이스가 잘 작용하게 도움'],['장액','작은창자에서 만들어져 작은창자로 분비. 소화의 마지막 단계에 관여']];
page(5,`<path d="M200 300V185H345V325" stroke=#c98b5a stroke-width=16 fill=none stroke-linejoin=round /><path d="M255 190H320V212H220V236H320V260H220V284H270V300H200" stroke=#f0a4b0 stroke-width=12 fill=none stroke-linejoin=round />
<ellipse id=mouth class=cl onclick="og('mouth')" cx=250 cy=30 rx=40 ry=16 fill=#e57a7a /><rect id=eso class=cl onclick="og('eso')" x=244 y=46 width=12 height=64 fill=#d69 /><ellipse id=sto class=cl onclick="og('sto')" cx=272 cy=138 rx=45 ry=30 fill=#e0a060 />
<ellipse id=liv class=cl onclick="og('liv')" cx=190 cy=128 rx=52 ry=26 fill=#8a4a30 /><circle id=gal class=cl onclick="og('gal')" cx=222 cy=160 r=9 fill=#3fbf6a /><ellipse id=pan class=cl onclick="og('pan')" cx=285 cy=173 rx=40 ry=8 fill=#e8b0c0 /><ellipse id=sm class=cl onclick="og('sm')" cx=270 cy=237 rx=55 ry=52 fill=#0000 /><rect id=lg class=cl onclick="og('lg')" x=192 y=180 width=12 height=110 fill=#0000 />
<line x1=470 y1=180 x2=470 y2=330 stroke=#e33 stroke-width=8 />${T(470,172,'혈액','#f88')}${T(250,10,'입')}${T(120,130,'간')}${T(150,168,'쓸개')}${T(340,178,'이자','#fcd',11)}${T(345,138,'위')}${T(275,320,'작은창자','#fcd',11)}${T(395,262,'큰창자','#fc9',11)}${T(345,348,'항문')}
${LG([['#ffd23f',6,'녹말(탄수화물)'],['#ff6b6b',6,'단백질'],['#fff',6,'지방'],['#ffd23f',3,'포도당'],['#ff6b6b',3,'아미노산'],['#fff',3,'지방산'],[CC.w,3,'물'],['#8a6a3a',4,'찌꺼기']],410,38,0,17,1)}`,
btn('음식물 먹기','eat()')+J.map((j,i)=>btn(j[0],`jc(${i})`)).join(''),'0 0 600 355');
info('기관을 클릭하거나 소화액 버튼을 눌러 보세요. 큰 입자 = 영양소, 작은 입자 = 소화가 끝난 산물');
$('main').insertAdjacentHTML('beforeend',`<div class=card><table><tr><td>녹말</td><td>→ 침·이자액의 <b>아밀레이스</b> →</td><td><b>포도당</b></td></tr><tr><td>단백질</td><td>→ 위액의 <b>펩신</b>, 이자액의 <b>트립신</b> →</td><td><b>아미노산</b></td></tr><tr><td>지방</td><td>→ 쓸개즙(지방을 잘게 나눔) + 이자액의 <b>라이페이스</b> →</td><td><b>지방산</b>(+모노글리세리드)</td></tr></table><div id=cap style="margin-top:8px;color:#4ff0b0"></div></div>`);

function qs(){const q=QZ.l[QZ.i];if(!q){$('main').innerHTML=`<div class=card><h2>완료!</h2>${btn('홈으로',"go('home')")}</div>`;return}
const o=q[2].map((t,i)=>[t,i]).sort(()=>Math.random()-.5);$('main').innerHTML=`<div class=card><small>${QZ.i+1}/${QZ.l.length} · ${U[q[0]]}</small><h3>${q[1]}</h3><div id=ops>${o.map(([t,i])=>`<button class=b style="display:block;width:100%;margin:6px 0;text-align:left" onclick="an2(${i},this)">${t}</button>`).join('')}</div><div id=fb></div></div>`}
window.an2=(i,el)=>{if(QZ.d)return;QZ.d=1;const q=QZ.l[QZ.i],ok=i==q[3];rec(q,q[2][i],ok);document.querySelectorAll('#ops button').forEach(b=>{if(b.textContent==q[2][q[3]])b.classList.add('ok')});if(!ok)el.classList.add('no');E('fb').innerHTML=`<p>${ok?'정답!':'오답 — 정답: '+q[2][q[3]]}</p>`+btn('다음','QZ.i++;QZ.d=0;qs()')};
function rec(q,ch,ok){const t=f(new Date());S.tot++;ok&&S.cor++;if(S.td.d!=t)S.td={d:t,n:0};S.td.n++;if(!S.days.includes(t))S.days.push(t);S.rec=U[q[0]];const p=S.tp[q[0]]||(S.tp[q[0]]={n:0,c:0});p.n++;ok&&p.c++;S.wrong=S.wrong.filter(w=>w.q!=q[1]);if(!ok)S.wrong.push({q:q[1],u:q[0],a:ch,r:q[2][q[3]],d:t});save()}
